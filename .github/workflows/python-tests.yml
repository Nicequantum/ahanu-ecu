name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - run: python -m grok_pilot.stress --samples 3000
  envelope-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libgtest-dev
      - run: cmake -S firmware/envelope -B build/envelope -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/envelope -j
      - run: ctest --test-dir build/envelope --output-on-failure
  envelope-teensy41:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-teensy41-v1
      - run: pip install platformio
      - run: pio run -d firmware/envelope/pio -e teensy41
