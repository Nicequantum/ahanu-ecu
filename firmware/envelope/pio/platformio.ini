; Compile-only smoke build of the envelope header for the Teensy 4.1 target.
; Same platform/board as third_party/speeduino [env:teensy41].
[env:teensy41]
platform = https://github.com/platformio/platform-teensy.git
board = teensy41
framework = arduino
build_flags = -I../ -ffp-contract=off -Wall -Wextra
